services:
  document-engine:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_FILE_NAME: /app/data/local.db

    volumes:
      - document_data:/app/data

    restart: unless-stopped

volumes:
  document_data:
